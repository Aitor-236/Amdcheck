[package]
name = "mdcheck"
version = "0.1.0"
edition = "2024"
description = "A minimal markdown link checker"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Aitor-236/mdcheck.git"
keywords = ["markdown", "link", "checker", "broken-link"]
categories = ["development-tools"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"

[dev-dependencies]
tempfile = "3.27.0"
regex = "1.13.1"
